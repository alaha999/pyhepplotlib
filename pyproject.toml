[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhepplotlib"
version = "0.1.0"
description = "A lightweight pyplot-like plotting interface for ROOT histograms"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tabulate>=0.9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
