name: Tests

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: rootproject/root:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        run: |
          apt-get update
          apt-get install -y python3-pip python3-venv

          python3 -m venv /opt/venv

          /opt/venv/bin/python -m pip install --upgrade pip
          /opt/venv/bin/python -m pip install -e .
          /opt/venv/bin/python -m pip install pytest tabulate

      - name: Check environment
        run: |
          export PATH="/opt/venv/bin:$PATH"

          echo "Python:"
          which python3
          python3 --version

          echo "ROOT:"
          root-config --version

          echo "PyROOT:"
          python3 -c "import ROOT; print(ROOT.gROOT.GetVersion())"

          echo "pyplotlib:"
          python3 -c "import pyplotlib; print(pyplotlib.__file__)"

      - name: Run tests
        run: |
          export PATH="/opt/venv/bin:$PATH"

          chmod +x run-test.sh
          ./run-test.sh
